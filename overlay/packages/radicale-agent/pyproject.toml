[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "radicale-agent"
version = "0.2.0"
description = "Standalone host MCP server for the authorized Agent CalDAV collection"
requires-python = ">=3.11"
dependencies = [
  "caldav>=3.3.1,<4",
  "icalendar>=7.2.2,<8",
  "mcp>=2.2.0,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
radicale-agent-mcp = "radicale_agent.server:main"
radicale-agent-discover = "radicale_agent.discover:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1,<2", "mcp-dbus-proxy"]

[tool.uv.sources]
mcp-dbus-proxy = { path = "../mcp-dbus-proxy", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: opt-in tests against the approved Agent collection (write tests create and modify only unique test fixtures)"]
