[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "radicale-agent"
version = "0.2.0"
description = "Host D-Bus CalDAV broker and sandbox MCP facade"
requires-python = ">=3.11"
dependencies = [
  "caldav==3.3.1",
  "icalendar==7.2.2",
  "dbus-next==0.2.3",
  "mcp==1.29.0",
  "pydantic>=2.11,<3",
]

[project.scripts]
radicale-agentd = "radicale_agent.daemon:main"
radicale-agent-mcp = "radicale_agent.server:main"
radicale-agent-discover = "radicale_agent.discover:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: opt-in tests against the approved Agent collection (write tests create and modify only unique test fixtures)"]
